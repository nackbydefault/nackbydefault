<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">NACK — Negative acknowledgment as a service</title>
  <desc id="desc">A green and black terminal panel with the NACK wordmark and a simulated negative acknowledgment response.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#121c17"/><stop offset="1" stop-color="#080d0b"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#89ff58" stroke-opacity=".045"/></pattern>
    <style>.cursor{animation:blink 1.4s step-end infinite}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.cursor{animation:none}}</style>
  </defs>
  <rect x="1" y="1" width="958" height="298" rx="15" fill="url(#bg)" stroke="#34473b" stroke-width="2"/>
  <rect x="2" y="43" width="956" height="255" fill="url(#grid)"/>
  <path d="M1 43H959" stroke="#34473b"/>
  <circle cx="23" cy="22" r="4.5" fill="#ff775e"/><circle cx="39" cy="22" r="4.5" fill="#e1b85c"/><circle cx="55" cy="22" r="4.5" fill="#8bff58"/>
  <g font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#b2c2b8">
    <text x="79" y="26">nack@localhost:~</text><text x="932" y="26" text-anchor="end">DEFAULT POLICY: DENY</text>
    <text x="35" y="79" font-size="13" fill="#8bff58" letter-spacing="2">NEGATIVE ACKNOWLEDGMENT</text>
    <text x="31" y="181" font-size="110" font-weight="bold" letter-spacing="-5" fill="#e9f6e9">NACK<tspan fill="#8bff58" font-size="69" letter-spacing="-5">&gt;_</tspan></text>
    <text x="36" y="219" font-size="16" fill="#b2c2b8" letter-spacing="1">AS A SERVICE</text>
    <text x="36" y="267" font-size="13" fill="#8bff58">NO REPRO. NO MERGE.</text>
    <rect x="528" y="66" width="396" height="179" rx="8" fill="#070c09" stroke="#30483a"/>
    <text x="548" y="92" font-size="12" fill="#81998a">// simulated session</text>
    <text x="548" y="122" font-size="15" fill="#8bff58">$ <tspan fill="#e9f6e9">nackctl evaluate --default</tspan></text>
    <text x="548" y="151" font-size="15" fill="#b2c2b8">[INFO] <tspan fill="#e9f6e9">assumptions rejected</tspan></text>
    <text x="548" y="178" font-size="15" fill="#ff9c83">[NACK] <tspan fill="#e9f6e9">evidence required</tspan></text>
    <text x="548" y="217" font-size="15" fill="#8bff58">$</text><rect class="cursor" x="568" y="203" width="9" height="17" rx="1" fill="#8bff58"/>
    <circle cx="535" cy="264" r="4" fill="#8bff58"/><text x="548" y="268" font-size="12" fill="#b2c2b8">STATUS: RELUCTANTLY ONLINE</text>
  </g>
</svg>
